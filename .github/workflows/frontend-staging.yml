name: Frontend Staging Deploy

on:
  push:
    branches: [main]
    paths:
      - 'Todo.Web/**'
      - '.github/workflows/frontend-staging.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: frontend-staging
  cancel-in-progress: true

defaults:
  run:
    working-directory: Todo.Web

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Todo.Web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build for staging
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.STAGING_API_URL }}

      - name: Verify production bundle
        run: npm run verify:build

      - name: Upload staging artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publish:
    runs-on: ubuntu-latest
    needs: deploy
    environment:
      name: staging
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
